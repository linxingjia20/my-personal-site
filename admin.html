<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", sans-serif; }
        body { background: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); width: 100%; max-width: 500px; display: none; }
        .login-box { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #666; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.3s; }
        input:focus, textarea:focus { border-color: #3498db; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <!-- 登录框 -->
    <div class="login-box" id="loginBox">
        <h2>🔒 后台管理登录</h2>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="请输入管理密码 (提示：123456)">
        </div>
        <button onclick="login()">登录</button>
        <a href="index.html" class="back-link">← 返回前台</a>
    </div>

    <!-- 管理表单 -->
    <div class="container" id="adminForm">
        <h2>⚙️ 修改个人信息</h2>
        <div class="form-group">
            <label>姓名 / 昵称</label>
            <input type="text" id="nameInput">
        </div>
        <div class="form-group">
            <label>个人简介 (一句话)</label>
            <input type="text" id="bioInput">
        </div>
        <div class="form-group">
            <label>关于我 (详细介绍)</label>
            <textarea id="aboutInput" rows="4"></textarea>
        </div>
        <button onclick="saveData()">保存并返回前台</button>
        <a href="index.html" class="back-link">← 取消返回</a>
    </div>

    <script>
        // 简单的登录逻辑
        function login() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === '123456') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminForm').style.display = 'block';
                loadData();
            } else {
                alert('密码错误！请重试。');
            }
        }

        // 读取已有数据填入表单
        function loadData() {
            document.getElementById('nameInput').value = localStorage.getItem('site_name') || '';
            document.getElementById('bioInput').value = localStorage.getItem('site_bio') || '';
            document.getElementById('aboutInput').value = localStorage.getItem('site_about') || '';
        }

        // 保存数据
        function saveData() {
            const name = document.getElementById('nameInput').value;
            const bio = document.getElementById('bioInput').value;
            const about = document.getElementById('aboutInput').value;

            localStorage.setItem('site_name', name);
            localStorage.setItem('site_bio', bio);
            localStorage.setItem('site_about', about);

            alert('保存成功！即将返回主页。');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
