<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #333; }
        .card { background: rgba(255,255,255,0.9); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 90%; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 2.5rem; }
        .subtitle { color: #7f8c8d; font-size: 1.2rem; margin-bottom: 30px; }
        .section-title { font-size: 1.2rem; color: #34495e; border-bottom: 2px solid #3498db; display: inline-block; margin: 20px 0 15px; padding-bottom: 5px; }
        p { line-height: 1.6; color: #555; margin-bottom: 15px; }
        .admin-link { display: inline-block; margin-top: 30px; color: #3498db; text-decoration: none; font-size: 0.9rem; }
        .admin-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="display-name">你的名字</h1>
        <p class="subtitle" id="display-bio">这是一个用于展示个人信息的副标题。</p>
        
        <div class="section-title">关于我</div>
        <p id="display-about">这里是一段关于我的详细介绍。我是一个热爱技术、喜欢折腾的开发者。欢迎来到我的个人网站！</p>
        
        <div class="section-title">我的项目</div>
        <p>1. 智能电商图片下载插件<br>2. 极简个人主页项目</p>

        <a href="admin.html" class="admin-link">进入后台管理 ⚙️</a>
    </div>

    <script>
        // 读取本地存储的数据
        const name = localStorage.getItem('site_name');
        const bio = localStorage.getItem('site_bio');
        const about = localStorage.getItem('site_about');

        if (name) document.getElementById('display-name').innerText = name;
        if (bio) document.getElementById('display-bio').innerText = bio;
        if (about) document.getElementById('display-about').innerText = about;
    </script>
</body>
</html>
